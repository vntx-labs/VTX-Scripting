name: Update von FileZilla empfangen

on:
  repository_dispatch:
    types: [filezilla_update]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lade neue Version von InfinityFree
        run: |
          # Hole den Dateinamen ab
          DATEINAME="${{ github.event.client_payload.dateiname }}"
          
          # Sicherheitsnetz: Falls GitHub den Namen verschluckt, erzwinge vtx-lang-v2.0.0.tar.gz
          if [ -z "$DATEINAME" ]; then
            echo "Fehler: Kein Dateiname übergeben! Nutze automatischen Name..."
            DATEINAME="vtx-lang-v2.0.0.tar.gz"
          fi
          
          echo "Lade Datei herunter: $DATEINAME"
          
          # Nutze hier deine echte InfinityFree-Adresse statt 'vntx-labs.infinityfreeapp.com'
          curl -sL "http://infinityfreeapp.com" -o "$DATEINAME"

      - name: Commit und Push der neuen Datei
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Automatisch aktualisiert via FileZilla"
          git push origin main
