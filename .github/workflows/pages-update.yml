name: Update von FileZilla empfangen

on:
  repository_dispatch:
    types: [filezilla_update] # Signalname aus deinem PHP-Skript
  workflow_dispatch: # Ermöglicht dir, den Workflow testweise per Hand zu starten

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh-pages:
    runs-on: ubuntu-latest
    steps:
      # 1. Repository auschecken
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Die neue .tar.gz Datei von InfinityFree holen
      - name: Lade neue Version von InfinityFree
        run: |
          echo "Lade Datei herunter: ${{ github.event.client_payload.dateiname }}"
          curl -sL "http://infinityfreeapp.com{{ github.event.client_payload.dateiname }}" -o "${{ github.event.client_payload.dateiname }}"

      # 3. Datei im Repository sichern und pushen
      - name: Commit und Push der neuen Datei
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Automatisch hinzugefügt: ${{ github.event.client_payload.dateiname }}"
          git push origin main
