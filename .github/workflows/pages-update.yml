name: Update von FileZilla empfangen

on:
  repository_dispatch:
    types: [filezilla_update]
  workflow_dispatch: # Erlaubt manuelles Testen auf GitHub

permissions:
  contents: write

jobs:
  refresh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lade neue Version von InfinityFree
        run: |
          # Extrahiere den Dateinamen aus dem API-Signal
          DATEINAME="${{ github.event.client_payload.dateiname }}"
          
          # Sicherheitsnetz: Falls DATEINAME leer ist, brich nicht ab, sondern nutze einen Platzhalter
          if [ -z "$DATEINAME" ]; then
            echo "WARNUNG: Kein Dateiname übergeben! Nutze Fallback-Namen."
            DATEINAME="archiv.tar.gz"
          fi
          
          echo "Verarbeite Datei: $DATEINAME"
          
          # Ersetze 'deine-subdomain' mit deinem echten InfinityFree-Namen!
          curl -sL "http://infinityfreeapp.com" -o "$DATEINAME"

      - name: Commit und Push der neuen Datei
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Automatisch aktualisiert via FileZilla"
          git push origin main
